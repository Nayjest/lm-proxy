name: Test Suite Run and Coverage Badge Update

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      update-badge:
        type: boolean
        default: false
      skip-ci:
        type: boolean
        description: Skip tests when caller detects [skip ci] on push (caller computes from head commit).
        default: false
      environment:
        type: string
        description: |
          GitHub Actions environment to enforce deployment protection rules.
          Use 'external-pr' for untrusted external PRs to require maintainer approval
          before accessing secrets, preventing malicious code from exfiltrating credentials.
    secrets:
      OPENAI_API_KEY:
        description: Required. Fork PRs receive it only after 'external-pr' approval.
        required: true

permissions:
  contents: read

jobs:
  test:
    if: ${{ !inputs.skip-ci }}
    runs-on: ubuntu-latest
    # Enforces GitHub Actions environment protection rules (manual approval for external PRs)
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref }}
        # Checking out PR head is what lets fork PRs be tested at all.
        #
        # (!) SECURITY: this exposes secrets to fork code. Mitigated by the 'external-pr'
        # environment on this job, which holds the run until a maintainer approves it.
        # Review fork PRs for secret exfiltration before approving.
        #
        # Note: "Approval for running fork pull request workflows"
        # (Settings -> Actions -> General) does NOT gate 'pull_request_target'.
        allow-unsafe-pr-checkout: true
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        pip install poetry
        poetry install -E test
        echo "$(poetry env info --path)/bin" >> $GITHUB_PATH
    # The integration tests need a live upstream, so every path gets the key.
    # Fork PRs reach this only after the 'external-pr' environment is approved.
    - name: Test with pytest
      if: matrix.python-version != '3.13'
      env:
        LLM_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        pytest
    - name: Test with pytest +coverage
      if: matrix.python-version == '3.13'
      env:
        LLM_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        pytest --cov=lm_proxy --cov-report=xml
    - name: Generate coverage badge
      if: matrix.python-version == '3.13' && inputs.update-badge
      run: |
        pip install genbadge[coverage]
        genbadge coverage -i coverage.xml -o coverage.svg
    - name: Validate coverage badge output
      if: matrix.python-version == '3.13' && inputs.update-badge
      run: |
        f=coverage.svg
        s=$(wc -c < "$f" 2>/dev/null) || s=0
        [ "$s" -ge 120 ] || { echo "$f missing or too small ($s B)"; exit 1; }
        head -c 4096 "$f" | grep -qiF '<svg' || { echo "$f: not an SVG"; exit 1; }
    - name: Upload coverage badge artifact
      if: success() && matrix.python-version == '3.13' && inputs.update-badge
      uses: actions/upload-artifact@v4
      with:
        name: coverage-badge
        path: coverage.svg
        if-no-files-found: error
        retention-days: 1
